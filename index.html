<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解憂 Bar - 5維時間點數雷達圖</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-deep: #050608;
      --bar-ambient: #110d18;
      --neon-pink: #ff2e88;
      --neon-blue: #2e97ff;
      --neon-purple: #bc2eff;
      --neon-yellow: #facc15;
      --neon-green: #39ff14;
      --neon-orange: #ff7b25;
      --neon-red: #ff2a2a;
      --neon-cyan: #00f5d4;
      --text-color: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: 
        radial-gradient(circle at 50% 0%, rgba(255, 138, 0, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 8% 25%, rgba(255, 46, 136, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 92% 75%, rgba(46, 151, 255, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(188, 46, 255, 0.12) 0%, transparent 50%),
        repeating-linear-gradient(0deg, #07080d 0px, #07080d 44px, #0e111a 45px, #07080d 46px),
        var(--bg-deep);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
      transition: background 0.6s ease;
    }

    body.anxiety-mode {
      background: 
        radial-gradient(circle at 50% 0%, rgba(255, 0, 50, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(180, 0, 0, 0.2) 0%, transparent 70%),
        repeating-linear-gradient(0deg, #120406 0px, #120406 44px, #25060e 45px, #120406 46px),
        #050002;
    }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 8, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .welcome-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-card {
      background: rgba(16, 20, 30, 0.95);
      border: 2px solid var(--neon-pink);
      border-radius: 28px;
      padding: 40px 36px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 35px rgba(255, 46, 136, 0.35), inset 0 0 15px rgba(255, 46, 136, 0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome-card h1 {
      font-size: 26px;
      color: var(--neon-pink);
      text-shadow: 0 0 10px var(--neon-pink);
      letter-spacing: 2px;
    }

    .welcome-card p {
      font-size: 14.5px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.6;
    }

    .welcome-input {
      width: 100%;
      padding: 12px 18px;
      background: rgba(8, 10, 16, 0.85);
      border: 1.5px solid var(--neon-purple);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      text-align: center;
      text-shadow: 0 0 4px #fff;
      box-shadow: 0 0 12px rgba(188, 46, 255, 0.25);
    }

    .start-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255, 46, 136, 0.15);
      border: 1.8px solid var(--neon-pink);
      border-radius: 14px;
      color: var(--neon-pink);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 46, 136, 0.3);
      text-shadow: 0 0 6px var(--neon-pink);
      transition: all 0.2s ease;
    }

    .ambient-icon {
      position: fixed;
      fill: none;
      stroke-width: 1.6;
      pointer-events: none;
      opacity: 0.22;
      filter: drop-shadow(0 0 10px currentColor);
      z-index: 0;
    }
    .amb-disc { top: 12%; left: 3%; width: 70px; height: 70px; color: var(--neon-purple); transform: rotate(-15deg); }
    .amb-note { bottom: 15%; left: 4%; width: 55px; height: 55px; color: var(--neon-yellow); transform: rotate(10deg); }
    .amb-candle { top: 18%; right: 3%; width: 60px; height: 60px; color: var(--neon-orange); }
    .amb-stars { bottom: 12%; right: 4%; width: 65px; height: 65px; color: var(--neon-blue); }

    .bar-sign {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 32px;
      background: rgba(10, 12, 18, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid var(--neon-pink);
      border-radius: 50px;
      box-shadow: 0 0 20px var(--neon-pink), inset 0 0 12px rgba(255, 46, 136, 0.35);
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-pink);
      letter-spacing: 2px;
      z-index: 2;
      margin-bottom: 24px;
    }

    body.anxiety-mode .bar-sign {
      border-color: var(--neon-red);
      box-shadow: 0 0 25px var(--neon-red), inset 0 0 15px rgba(255, 42, 42, 0.5);
      text-shadow: 0 0 10px var(--neon-red);
    }

    .sign-mini-icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }

    .container {
      background: rgba(13, 16, 25, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 2px solid rgba(188, 46, 255, 0.45);
      box-shadow: 0 0 40px rgba(188, 46, 255, 0.28), 0 25px 50px rgba(0,0,0,0.85);
      padding: 40px 46px;
      display: flex;
      flex-direction: row;
      gap: 46px;
      align-items: center;
      max-width: 1360px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    body.anxiety-mode .container {
      border-color: rgba(255, 42, 42, 0.6);
      box-shadow: 0 0 45px rgba(255, 42, 42, 0.35);
    }

    .bg-icon { position: absolute; fill: none; stroke-width: 1.8; pointer-events: none; opacity: 0.18; }
    .bg-cocktail { top: 22px; right: 28px; width: 70px; height: 70px; stroke: var(--neon-pink); }
    .bg-beer { bottom: 25px; right: 40px; width: 62px; height: 62px; stroke: var(--neon-yellow); }
    .bg-sparkle1 { top: 28%; left: 45%; width: 28px; height: 28px; stroke: var(--neon-blue); }
    .bg-heart { bottom: 20px; left: 28px; width: 55px; height: 55px; stroke: var(--neon-purple); }

    .controls { flex: 1.1; min-width: 360px; display: flex; flex-direction: column; gap: 12px; z-index: 1; }
    .title-box { display: flex; align-items: center; gap: 12px; }
    .title-icon { width: 34px; height: 34px; stroke: var(--neon-pink); }
    body.anxiety-mode .title-icon { stroke: var(--neon-red); }

    h2 { font-size: 24px; font-weight: 700; color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); }
    body.anxiety-mode h2 { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); }

    .subtitle { font-size: 13.5px; color: rgba(255, 255, 255, 0.7); }
    body.anxiety-mode .subtitle { color: #ff9999; }

    .stage-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 700; background: rgba(46, 151, 255, 0.15); border: 1px solid var(--neon-blue);
      color: var(--neon-blue); width: fit-content;
    }
    .stage-badge.comparing { background: rgba(0, 245, 212, 0.15); border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .stage-badge.finalized { background: rgba(57, 255, 20, 0.15); border-color: var(--neon-green); color: var(--neon-green); }
    body.anxiety-mode .stage-badge { background: rgba(255, 42, 42, 0.2); border-color: var(--neon-red); color: var(--neon-red); }

    .stat-row {
      display: flex; flex-direction: column; gap: 6px; background: rgba(255, 255, 255, 0.02);
      padding: 7px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    body.anxiety-mode .stat-row { border-color: rgba(255, 50, 50, 0.2); background: rgba(255, 0, 0, 0.03); }

    .stat-header { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; font-weight: 600; color: #f1f5f9; }
    .stat-title { display: flex; align-items: center; gap: 8px; }
    .stat-icon { width: 18px; height: 18px; stroke-width: 2; fill: none; }

    .stat-val-box {
      display: flex; align-items: center; gap: 6px; background: rgba(6, 8, 14, 0.85);
      padding: 2px 10px; border-radius: 8px; border: 1px solid rgba(46, 151, 255, 0.35);
    }
    .stat-val { color: var(--neon-blue); font-weight: 700; font-size: 15.5px; font-family: monospace; }
    body.anxiety-mode .stat-val { color: #ff7777; }
    .prev-val-tag { font-size: 12px; color: #94a3b8; font-weight: 500; }

    input[type="range"] {
      width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; outline: none; -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, var(--neon-blue) 0%, var(--neon-purple) 100%); height: 8px; border-radius: 4px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #ffffff; border: 2.5px solid var(--neon-blue); margin-top: -7px;
    }

    .points-box {
      margin-top: 2px; padding: 10px 14px; background: rgba(0, 0, 0, 0.5); border-radius: 12px;
      border: 2px solid var(--neon-green); display: flex; justify-content: space-between; align-items: center;
      font-size: 14.5px; font-weight: 700; color: var(--neon-green); font-family: monospace;
    }
    body.anxiety-mode .points-box { border-color: var(--neon-red); color: var(--neon-red); }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .action-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px;
      border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; outline: none;
    }
    .lock-prev-btn {
      grid-column: span 2; background: rgba(0, 245, 212, 0.12); border: 1.5px solid var(--neon-cyan); color: var(--neon-cyan);
    }
    .confirm-btn {
      background: rgba(57, 255, 20, 0.1); border: 1.5px solid var(--neon-green); color: var(--neon-green);
    }
    .confirm-btn:disabled, .clear-all-btn:disabled {
      opacity: 0.35; cursor: not-allowed; border-color: #475569; color: #64748b;
    }
    .clear-all-btn {
      background: rgba(148, 163, 184, 0.1); border: 1.5px solid #94a3b8; color: #e2e8f0;
    }

    .floating-anxiety-btn {
      position: fixed; right: 28px; bottom: 28px; z-index: 100; display: none; align-items: center; gap: 10px;
      padding: 14px 22px; border-radius: 50px; font-size: 15px; font-weight: 800; cursor: pointer;
      background: rgba(20, 10, 15, 0.85); border: 2px solid var(--neon-red); color: var(--neon-red);
    }
    .floating-anxiety-btn.revealed { display: flex; }
    body.anxiety-mode .floating-anxiety-btn { border-color: var(--neon-green); color: var(--neon-green); }

    .btn-icon { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; }

    .chart-container {
      flex: 1.3; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative;
    }

    .chart-legend {
      display: flex; gap: 20px; margin-bottom: 12px; background: rgba(0, 0, 0, 0.4); padding: 6px 16px;
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); font-size: 13px; font-weight: 600;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-line-current { width: 24px; height: 3.5px; background: var(--neon-blue); }
    .legend-line-prev { width: 24px; height: 2.5px; border-top: 2.5px dashed #94a3b8; }

    /* 明確宣告 SVG 寬度與高度以修復 Safari 截圖空白問題 */
    svg#radarSvg {
      width: 100%; max-width: 600px; height: 600px; overflow: visible;
    }

    .grid-line { fill: none; stroke: var(--neon-purple); stroke-width: 1.6; stroke-opacity: 0.7; }
    body.anxiety-mode .grid-line { stroke: #ff2a2a; stroke-opacity: 0.85; }

    .axis-line { stroke: rgba(255, 255, 255, 0.3); stroke-width: 1.4; stroke-dasharray: 4 4; }
    body.anxiety-mode .axis-line { stroke: rgba(255, 68, 68, 0.4); }

    .inward-vortex-layer { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
    body.anxiety-mode .inward-vortex-layer { opacity: 1; }

    .vortex-inflow-ring { fill: none; stroke: #ff2a2a; stroke-dasharray: 6 6 12 6; transform-origin: 300px 300px; }
    .vortex-inflow-1 { stroke-width: 1.6; animation: inwardSuck 3.2s infinite linear; }
    .vortex-inflow-2 { stroke-width: 1.3; stroke: #ff0055; stroke-dasharray: 4 6 8 4; animation: inwardSuck 4.2s infinite linear reverse; }
    .vortex-inflow-3 { stroke-width: 1.8; stroke: #bc2eff; animation: inwardSuck 5.5s infinite linear; }

    @keyframes inwardSuck {
      0% { transform: scale(1.2) rotate(0deg); opacity: 0.75; }
      100% { transform: scale(0.1) rotate(360deg); opacity: 0; }
    }

    .radar-area-prev { fill: rgba(148, 163, 184, 0.12); stroke: #cbd5e1; stroke-width: 2.5; stroke-dasharray: 6 4; }
    body.anxiety-mode .radar-area-prev { fill: rgba(148, 163, 184, 0.08); stroke: #8899aa; stroke-dasharray: 4 3; }

    .radar-point-prev { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .radar-area { fill: rgba(46, 151, 255, 0.24); stroke: var(--neon-blue); stroke-width: 3.8; }
    body.anxiety-mode .radar-area { fill: rgba(46, 151, 255, 0.16); stroke: #4488cc; stroke-dasharray: 5 3; }

    .radar-point { fill: #ffffff; stroke: var(--neon-blue); stroke-width: 2.8; }
    .stat-label { font-size: 14px; font-weight: 700; fill: var(--text-color); }
    body.anxiety-mode .stat-label { fill: #ffb4b4; }
    .svg-node-icon { stroke-width: 2; fill: none; }

    @media (max-width: 960px) {
      .ambient-icon { display: none; }
      .container { flex-direction: column-reverse; padding: 28px 20px; gap: 30px; }
      .controls { width: 100%; min-width: 100%; }
      svg#radarSvg { max-width: 440px; height: 440px; }
    }
  </style>
</head>
<body>

  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card">
      <div style="display:flex; justify-content:center;">
        <svg viewBox="0 0 24 24" width="36" height="36" stroke="var(--neon-pink)" fill="none" stroke-width="2"><path d="M8 22h8M12 15v7M3 4l9 11 9-11H3zM5.5 7h13"/></svg>
      </div>
      <h1>解憂 BAR 入口</h1>
      <p>歡迎來到精神調配所。在開始前，請留下你的名字或專屬代號：</p>
      <input type="text" id="welcomeNameInput" class="welcome-input" placeholder="輸入你的名字..." autofocus />
      <button class="start-btn" id="startPlanningBtn">🍸 進入調配吧檯</button>
    </div>
  </div>

  <div class="bar-sign" id="barSign">
    <svg class="sign-mini-icon" viewBox="0 0 24 24"><path d="M8 22h8M12 15v7M3 4l9 11 9-11H3z"/></svg>
    <span id="signText">🍸 地下解憂Bar 之精神分配</span>
    <svg class="sign-mini-icon" viewBox="0 0 24 24"><path d="m12 3 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>
  </div>

  <div class="container" id="captureContainer">
    <div class="controls">
      <div>
        <div class="title-box">
          <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M8 22h8M12 15v7M3 4l9 11 9-11H3zM5.5 7h13"/></svg>
          <h2 id="mainTitle">時間點數分配</h2>
        </div>
        <div class="stage-badge" id="stageBadge">
          <span>階段 1：設定【上學期】實際分配</span>
        </div>
        <p class="subtitle" id="mainSubtitle">拖曳滑桿分配時間（每項上限 50，總上限 100）</p>
      </div>

      <div id="sliders" style="display: flex; flex-direction: column; gap: 10px;"></div>

      <div class="points-box">
        <span>剩餘時間</span>
        <span id="points-display">100 / 100</span>
      </div>

      <div class="btn-grid">
        <button class="action-btn lock-prev-btn" id="lockPrevBtn">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span id="lockPrevBtnText">📌 鎖定為上學期（開始規劃下學期）</span>
        </button>

        <button class="action-btn confirm-btn" id="confirmBtn" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="confirmBtnText">確認精神規劃</span>
        </button>

        <button class="action-btn clear-all-btn" id="clearAllBtn" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
          <span>📸 存檔並換下位</span>
        </button>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-legend" id="chartLegend" style="display: none;">
        <div class="legend-item" id="legendPrev">
          <span class="legend-line-prev"></span>
          <span id="legendPrevText" style="color: #cbd5e1;">上學期基準</span>
        </div>
        <div class="legend-item" id="legendCurrent">
          <span class="legend-line-current"></span>
          <span id="legendCurrentText" style="color: var(--neon-blue);">下學期規劃</span>
        </div>
      </div>

      <!-- 明確寬高與 viewBox -->
      <svg id="radarSvg" viewBox="0 0 600 600" width="600" height="600"></svg>
    </div>
  </div>

  <button class="floating-anxiety-btn" id="anxietyBtn">
    <svg class="btn-icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
    <span id="anxietyBtnText">⚠️ 注入無意識焦慮</span>
  </button>

  <script>
    let currentUserName = '';
    let isAnxietyMode = false;
    let isFinalized = false;
    let TOTAL_POINTS = 100;
    const SLIDER_MAX = 50;
    const FIXED_SCALE_MAX = 30;
    const SHRINK_RATIO = 0.70;

    let previousStats = null;

    const stats = [
      { name: '課業', value: 0, color: '#38bdf8', iconPath: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>' },
      { name: '興趣/活動', value: 0, color: '#facc15', iconPath: '<path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>' },
      { name: '家庭', value: 0, color: '#ff2e88', iconPath: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>' },
      { name: '職涯打工', value: 0, color: '#bc2eff', iconPath: '<rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>' },
      { name: '同儕/戀愛', value: 0, color: '#39ff14', iconPath: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>' }
    ];

    const cx = 300, cy = 300, radius = 190;
    const svg = document.getElementById('radarSvg');
    const slidersContainer = document.getElementById('sliders');
    const lockPrevBtn = document.getElementById('lockPrevBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const anxietyBtn = document.getElementById('anxietyBtn');
    const captureContainer = document.getElementById('captureContainer');
    const welcomeOverlay = document.getElementById('welcomeOverlay');
    const welcomeNameInput = document.getElementById('welcomeNameInput');
    const startPlanningBtn = document.getElementById('startPlanningBtn');

    function isNightTime() {
      const currentHour = new Date().getHours();
      return currentHour >= 21 || currentHour < 6;
    }

    startPlanningBtn.addEventListener('click', () => {
      const name = welcomeNameInput.value.trim();
      currentUserName = name || '解憂訪客';
      document.getElementById('mainTitle').textContent = `${currentUserName} - 時間點數分配`;
      welcomeOverlay.classList.add('hidden');
    });

    welcomeNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startPlanningBtn.click();
    });

    function drawBackground() {
      svg.innerHTML = '';

      const vortexGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      vortexGroup.setAttribute('class', 'inward-vortex-layer');
      vortexGroup.innerHTML = `
        <circle cx="${cx}" cy="${cy}" r="110" class="vortex-inflow-ring vortex-inflow-1" />
        <circle cx="${cx}" cy="${cy}" r="75"  class="vortex-inflow-ring vortex-inflow-2" />
        <circle cx="${cx}" cy="${cy}" r="40"  class="vortex-inflow-ring vortex-inflow-3" />
        <circle cx="${cx}" cy="${cy}" r="6"   fill="rgba(255, 42, 42, 0.7)" />
      `;
      svg.appendChild(vortexGroup);

      for (let level = 1; level <= 5; level++) {
        const r = (radius / 5) * level;
        const pts = stats.map((_, i) => {
          const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
          return `${(cx + r * Math.cos(angle)).toFixed(1)},${(cy + r * Math.sin(angle)).toFixed(1)}`;
        }).join(' ');
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', pts);
        poly.setAttribute('class', 'grid-line');
        svg.appendChild(poly);
      }

      stats.forEach((stat, i) => {
        const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', cx);
        line.setAttribute('y1', cy);
        line.setAttribute('x2', x);
        line.setAttribute('y2', y);
        line.setAttribute('class', 'axis-line');
        svg.appendChild(line);

        const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const offsetDist = 28;
        const anchorX = cx + (radius + offsetDist) * Math.cos(angle);
        const anchorY = cy + (radius + offsetDist) * Math.sin(angle);

        let iconOffsetX = 0, iconOffsetY = 0;
        let textOffsetX = 0, textOffsetY = 0;
        let textAnchor = 'middle';

        if (i === 0) { iconOffsetX = -10; iconOffsetY = -8; textOffsetY = -24; }
        else if (i === 1) { iconOffsetX = 2; iconOffsetY = -24; textOffsetX = 2; textOffsetY = 4; textAnchor = 'start'; }
        else if (i === 2) { iconOffsetX = -10; iconOffsetY = 4; textOffsetY = 30; }
        else if (i === 3) { iconOffsetX = -10; iconOffsetY = 4; textOffsetY = 30; }
        else if (i === 4) { iconOffsetX = -20; iconOffsetY = -24; textOffsetX = -2; textOffsetY = 4; textAnchor = 'end'; }

        const iconG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        iconG.setAttribute('transform', `translate(${anchorX + iconOffsetX}, ${anchorY + iconOffsetY}) scale(0.8)`);
        iconG.setAttribute('class', 'svg-node-icon');
        iconG.setAttribute('stroke', stat.color);
        iconG.innerHTML = stat.iconPath;
        labelGroup.appendChild(iconG);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', anchorX + textOffsetX);
        text.setAttribute('y', anchorY + textOffsetY);
        text.setAttribute('text-anchor', textAnchor);
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('class', 'stat-label');
        text.textContent = stat.name;
        labelGroup.appendChild(text);

        svg.appendChild(labelGroup);
      });

      const radarPrevPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      radarPrevPoly.setAttribute('id', 'radarPrevPoly');
      radarPrevPoly.setAttribute('class', 'radar-area-prev');
      radarPrevPoly.style.display = 'none';
      svg.appendChild(radarPrevPoly);

      const pointsPrevGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      pointsPrevGroup.setAttribute('id', 'pointsPrevGroup');
      svg.appendChild(pointsPrevGroup);

      const radarPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      radarPoly.setAttribute('id', 'radarPoly');
      radarPoly.setAttribute('class', 'radar-area');
      svg.appendChild(radarPoly);

      const pointsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      pointsGroup.setAttribute('id', 'pointsGroup');
      svg.appendChild(pointsGroup);
    }

    function updateChart() {
      const poly = document.getElementById('radarPoly');
      const pointsGroup = document.getElementById('pointsGroup');
      const prevPoly = document.getElementById('radarPrevPoly');
      const pointsPrevGroup = document.getElementById('pointsPrevGroup');
      
      pointsGroup.innerHTML = '';
      pointsPrevGroup.innerHTML = '';

      const currentTotal = stats.reduce((sum, s) => sum + s.value, 0);

      if (previousStats) {
        prevPoly.style.display = 'block';
        const prevCoords = previousStats.map((stat, i) => {
          const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
          let effectivePrevVal = stat.value;
          if (isAnxietyMode && effectivePrevVal > 0) {
            effectivePrevVal = Math.round(effectivePrevVal * SHRINK_RATIO);
          }
          const r = (effectivePrevVal > 0) ? Math.min(radius, (effectivePrevVal / FIXED_SCALE_MAX) * radius) : 0;
          const x = cx + r * Math.cos(angle);
          const y = cy + r * Math.sin(angle);

          if (effectivePrevVal > 0) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', x);
            circle.setAttribute('cy', y);
            circle.setAttribute('r', isAnxietyMode ? 3.8 : 4.5);
            circle.setAttribute('class', 'radar-point-prev');
            pointsPrevGroup.appendChild(circle);
          }
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        prevPoly.setAttribute('points', prevCoords.join(' '));
      } else {
        prevPoly.style.display = 'none';
      }

      const coords = stats.map((stat, i) => {
        const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
        let effectiveVal = stat.value;
        if (isAnxietyMode && effectiveVal > 0) {
          effectiveVal = Math.round(effectiveVal * SHRINK_RATIO);
        }
        const r = (effectiveVal > 0) ? Math.min(radius, (effectiveVal / FIXED_SCALE_MAX) * radius) : 0;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);

        if (effectiveVal > 0) {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', x);
          circle.setAttribute('cy', y);
          circle.setAttribute('r', isAnxietyMode ? 4.2 : 5.5);
          circle.setAttribute('class', 'radar-point');
          pointsGroup.appendChild(circle);
        }
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      poly.setAttribute('points', coords.join(' '));

      const remaining = TOTAL_POINTS - currentTotal;
      document.getElementById('points-display').textContent = isAnxietyMode ? `0 (被內耗吞噬)` : `${remaining} / ${TOTAL_POINTS}`;
    }

    function createSliders() {
      slidersContainer.innerHTML = '';
      stats.forEach((stat, i) => {
        let prevValInfo = '';
        if (previousStats) {
          if (isAnxietyMode && previousStats[i].value > 0) {
            const shrinkPrev = Math.round(previousStats[i].value * SHRINK_RATIO);
            prevValInfo = `<span class="prev-val-tag" style="color:#ff8888;">（上學期萎縮: ${shrinkPrev}）</span>`;
          } else {
            prevValInfo = `<span class="prev-val-tag">（上學期: ${previousStats[i].value}）</span>`;
          }
        }

        let displayVal = stat.value;
        if (isAnxietyMode && stat.value > 0) {
          const shrinkVal = Math.round(stat.value * SHRINK_RATIO);
          displayVal = `${shrinkVal} <span style="font-size:12px;color:#ff6666;">(-${stat.value - shrinkVal})</span>`;
        }

        const isInputDisabled = isAnxietyMode || isFinalized;

        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <div class="stat-header">
            <div class="stat-title">
              <svg class="stat-icon" style="stroke: ${isAnxietyMode ? '#ff4444' : stat.color};" viewBox="0 0 24 24">${stat.iconPath}</svg>
              <span style="${isAnxietyMode ? 'color:#ff9999;' : ''}">${stat.name}</span>
              ${prevValInfo}
            </div>
            <div class="stat-val-box">
              <span class="stat-val" id="val-${i}">${displayVal}</span>
            </div>
          </div>
          <input type="range" min="0" max="${SLIDER_MAX}" value="${stat.value}" data-index="${i}" ${isInputDisabled ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>
        `;
        slidersContainer.appendChild(row);
      });

      slidersContainer.addEventListener('input', (e) => {
        if (!e.target.matches('input[type="range"]') || isAnxietyMode || isFinalized) return;
        const idx = Number(e.target.dataset.index);
        let newVal = Number(e.target.value);
        const otherSum = stats.reduce((sum, s, i) => i === idx ? sum : sum + s.value, 0);
        
        if (newVal + otherSum > TOTAL_POINTS) {
          newVal = TOTAL_POINTS - otherSum;
          e.target.value = newVal;
        }

        stats[idx].value = newVal;
        document.getElementById(`val-${idx}`).textContent = newVal;
        updateChart();
      });
    }

    lockPrevBtn.addEventListener('click', () => {
      if (isAnxietyMode || isFinalized) return;
      const currentSum = stats.reduce((sum, s) => sum + s.value, 0);
      if (currentSum === 0) {
        alert('請先為「上學期」分配點數後再進行鎖定比對喔！');
        return;
      }

      previousStats = JSON.parse(JSON.stringify(stats));
      stats.forEach(s => s.value = 0);
      confirmBtn.disabled = false;

      const stageBadge = document.getElementById('stageBadge');
      stageBadge.classList.add('comparing');
      stageBadge.innerHTML = '<span>階段 2：規劃【下學期】（完成後請點擊確認）</span>';
      document.getElementById('chartLegend').style.display = 'flex';
      document.getElementById('legendPrev').style.display = 'flex';
      document.getElementById('lockPrevBtnText').textContent = '📌 重新更新上學期基準';

      createSliders();
      updateChart();
    });

    confirmBtn.addEventListener('click', () => {
      if (isFinalized || !previousStats) return;
      const currentSum = stats.reduce((sum, s) => sum + s.value, 0);
      if (currentSum === 0) {
        alert('請先分配「下學期」的點數後再點擊確認喔！');
        return;
      }

      isFinalized = true;
      lockPrevBtn.disabled = true;
      lockPrevBtn.style.opacity = '0.4';
      lockPrevBtn.style.cursor = 'not-allowed';

      confirmBtn.disabled = true;
      document.getElementById('confirmBtnText').textContent = '🔒 已確認（無法再修改）';

      clearAllBtn.disabled = false;

      const stageBadge = document.getElementById('stageBadge');
      stageBadge.className = 'stage-badge finalized';
      stageBadge.innerHTML = '<span>🎉 規劃已確認完成（可點擊存檔並換下位）</span>';

      createSliders();

      if (isNightTime()) {
        anxietyBtn.classList.add('revealed');
      }
    });

    // 【iPad Safari 專用高相容截圖函式】
    async function captureElement(element) {
      return await html2canvas(element, {
        backgroundColor: '#090a10',
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false
      });
    }

    // 【自動上下合併畫布，100% 規避 Safari 攔截連續下載問題】
    function combineCanvases(c1, c2) {
      const merged = document.createElement('canvas');
      merged.width = Math.max(c1.width, c2.width);
      merged.height = c1.height + c2.height + 40;
      const ctx = merged.getContext('2d');

      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, merged.width, merged.height);

      ctx.drawImage(c1, 0, 0);
      
      // 分隔線
      ctx.strokeStyle = '#bc2eff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(40, c1.height + 20);
      ctx.lineTo(merged.width - 40, c1.height + 20);
      ctx.stroke();

      ctx.drawImage(c2, 0, c1.height + 40);
      return merged;
    }

    clearAllBtn.addEventListener('click', async () => {
      if (!isFinalized || !previousStats) {
        alert('請先完成雙學期規劃並按下確認後才能存檔喔！');
        return;
      }

      const userName = currentUserName || '未命名規劃師';
      const confirmSave = confirm(`即將保存【${userName}】的規劃對比圖檔，並清空換下一位，是否繼續？`);
      if (!confirmSave) return;

      const now = new Date();
      const dateStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}`;

      // 1. 截取正常規劃版
      isAnxietyMode = false;
      document.body.classList.remove('anxiety-mode');
      createSliders();
      updateChart();
      await new Promise(r => setTimeout(r, 200));
      const canvas1 = await captureElement(captureContainer);

      // 2. 截取焦慮版
      isAnxietyMode = true;
      document.body.classList.add('anxiety-mode');
      createSliders();
      updateChart();
      await new Promise(r => setTimeout(r, 200));
      const canvas2 = await captureElement(captureContainer);

      // 3. 雙圖無縫合併成一張大圖，單次觸發下載
      const combined = combineCanvases(canvas1, canvas2);
      const link = document.createElement('a');
      link.download = `解憂Bar_${userName}_雙學期與焦慮對比_${dateStr}.png`;
      link.href = combined.toDataURL('image/png');
      link.click();

      document.body.classList.remove('anxiety-mode');

      // 重置回到下一位
      isAnxietyMode = false;
      previousStats = null;
      isFinalized = false;
      stats.forEach(s => s.value = 0);
      currentUserName = '';

      lockPrevBtn.disabled = false;
      lockPrevBtn.style.opacity = '1';
      lockPrevBtn.style.cursor = 'pointer';

      confirmBtn.disabled = true;
      document.getElementById('confirmBtnText').textContent = '確認精神規劃';
      clearAllBtn.disabled = true;

      anxietyBtn.classList.remove('revealed');

      const stageBadge = document.getElementById('stageBadge');
      stageBadge.className = 'stage-badge';
      stageBadge.innerHTML = '<span>階段 1：設定【上學期】實際分配</span>';
      document.getElementById('chartLegend').style.display = 'none';
      document.getElementById('lockPrevBtnText').textContent = '📌 鎖定為上學期（開始規劃下學期）';
      document.getElementById('mainTitle').textContent = '時間點數分配';

      createSliders();
      updateChart();

      welcomeNameInput.value = '';
      welcomeOverlay.classList.remove('hidden');
    });

    anxietyBtn.addEventListener('click', () => {
      isAnxietyMode = !isAnxietyMode;

      if (isAnxietyMode) {
        document.body.classList.add('anxiety-mode');
        document.getElementById('signText').textContent = '⚠️ 現實焦慮Bar · 雙學期內耗侵蝕中';
        document.getElementById('mainTitle').textContent = `${currentUserName} - 無意識焦慮侵蝕`;
        document.getElementById('stageBadge').innerHTML = '<span>⚠️ 警報：雙學期產出同步微幅塌陷</span>';
        document.getElementById('anxietyBtnText').textContent = '✨ 喚回理智與掌控感';
        document.getElementById('chartLegend').style.display = 'flex';
        document.getElementById('legendCurrentText').textContent = '下學期 (萎縮)';
        document.getElementById('legendPrevText').textContent = '上學期 (萎縮)';
      } else {
        document.body.classList.remove('anxiety-mode');
        document.getElementById('signText').textContent = '🍸 地下解憂Bar 之精神分配';
        document.getElementById('mainTitle').textContent = `${currentUserName} - 時間點數分配`;
        const stageBadge = document.getElementById('stageBadge');
        stageBadge.className = 'stage-badge finalized';
        stageBadge.innerHTML = '<span>🎉 規劃已確定完成（可點擊存檔並換下位）</span>';
        document.getElementById('legendPrevText').textContent = '上學期基準';
        document.getElementById('anxietyBtnText').textContent = '⚠️ 注入無意識焦慮';
        document.getElementById('legendCurrentText').textContent = '下學期規劃';
      }

      createSliders();
      updateChart();
    });

    drawBackground();
    createSliders();
    updateChart();
  </script>
</body>
</html>
