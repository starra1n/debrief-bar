<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地下解憂Bar-精神調配所</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-deep: #050608;
      --bar-ambient: #110d18;
      --neon-pink: #ff2e88;
      --neon-blue: #2e97ff;
      --neon-purple: #bc2eff;
      --neon-yellow: #facc15;
      --neon-green: #39ff14;
      --neon-orange: #ff7b25;
      --neon-red: #ff2a2a;
      --neon-cyan: #00f5d4;
      --text-color: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: 
        radial-gradient(circle at 50% 0%, rgba(255, 138, 0, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 8% 25%, rgba(255, 46, 136, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 92% 75%, rgba(46, 151, 255, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(188, 46, 255, 0.12) 0%, transparent 50%),
        repeating-linear-gradient(0deg, #07080d 0px, #07080d 44px, #0e111a 45px, #07080d 46px),
        var(--bg-deep);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
      transition: background 0.6s ease;
    }

    body.anxiety-mode {
      background: 
        radial-gradient(circle at 50% 0%, rgba(255, 0, 50, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(180, 0, 0, 0.2) 0%, transparent 70%),
        repeating-linear-gradient(0deg, #120406 0px, #120406 44px, #25060e 45px, #120406 46px),
        #050002;
    }

    /* 歡迎入口彈窗 */
    .welcome-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 8, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .welcome-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-card {
      background: rgba(16, 20, 30, 0.95);
      border: 2px solid var(--neon-pink);
      border-radius: 28px;
      padding: 40px 36px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 35px rgba(255, 46, 136, 0.35), inset 0 0 15px rgba(255, 46, 136, 0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .welcome-card h1 {
      font-size: 26px;
      color: var(--neon-pink);
      text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
      letter-spacing: 2px;
    }

    .welcome-card p {
      font-size: 14.5px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.6;
    }

    .welcome-input {
      width: 100%;
      padding: 12px 18px;
      background: rgba(8, 10, 16, 0.85);
      border: 1.5px solid var(--neon-purple);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      text-align: center;
      text-shadow: 0 0 4px #fff;
      box-shadow: 0 0 12px rgba(188, 46, 255, 0.25);
    }
    .welcome-input:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 18px rgba(46, 151, 255, 0.5);
    }

    .start-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255, 46, 136, 0.15);
      border: 1.8px solid var(--neon-pink);
      border-radius: 14px;
      color: var(--neon-pink);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 46, 136, 0.3);
      text-shadow: 0 0 6px var(--neon-pink);
      transition: all 0.2s ease;
    }
    .start-btn:hover {
      background: rgba(255, 46, 136, 0.3);
      box-shadow: 0 0 24px rgba(255, 46, 136, 0.6);
      transform: translateY(-2px);
    }

    .ambient-icon {
      position: fixed;
      fill: none;
      stroke-width: 1.6;
      pointer-events: none;
      opacity: 0.22;
      filter: drop-shadow(0 0 10px currentColor);
      z-index: 0;
      transition: all 0.5s ease;
    }
    .amb-disc { top: 12%; left: 3%; width: 70px; height: 70px; color: var(--neon-purple); transform: rotate(-15deg); }
    .amb-note { bottom: 15%; left: 4%; width: 55px; height: 55px; color: var(--neon-yellow); transform: rotate(10deg); }
    .amb-candle { top: 18%; right: 3%; width: 60px; height: 60px; color: var(--neon-orange); }
    .amb-stars { bottom: 12%; right: 4%; width: 65px; height: 65px; color: var(--neon-blue); }

    .bar-sign {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 32px;
      background: rgba(10, 12, 18, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid var(--neon-pink);
      border-radius: 50px;
      box-shadow: 0 0 20px var(--neon-pink), inset 0 0 12px rgba(255, 46, 136, 0.35);
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-pink);
      letter-spacing: 2px;
      animation: neonFlicker 4.5s infinite alternate;
      z-index: 2;
      margin-bottom: 8px;
      transition: all 0.4s ease;
    }

    body.anxiety-mode .bar-sign {
      border-color: var(--neon-red);
      box-shadow: 0 0 25px var(--neon-red), inset 0 0 15px rgba(255, 42, 42, 0.5);
      text-shadow: 0 0 10px var(--neon-red);
      animation: panicGlitch 1s infinite;
    }

    .sign-mini-icon {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        box-shadow: 0 0 22px var(--neon-pink), inset 0 0 12px rgba(255, 46, 136, 0.35);
        border-color: var(--neon-pink);
      }
      20%, 24%, 55% {
        box-shadow: 0 0 5px rgba(255, 46, 136, 0.3);
        border-color: rgba(255, 46, 136, 0.4);
      }
    }

    @keyframes panicGlitch {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -1px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(2px, 2px); }
    }

    .container {
      background: rgba(13, 16, 25, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 2px solid rgba(188, 46, 255, 0.45);
      box-shadow: 
        0 0 40px rgba(188, 46, 255, 0.28), 
        0 25px 50px rgba(0,0,0,0.85),
        inset 0 0 25px rgba(188, 46, 255, 0.12);
      padding: 12px 48px;
      display: flex;
      flex-direction: row;
      gap: 50px;
      align-items: center;
      max-width: 1360px;
      width: 100%;
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: all 0.4s ease;
    }

    body.anxiety-mode .container, .container.fake-anxiety {
      border-color: rgba(255, 42, 42, 0.6) !important;
      box-shadow: 0 0 45px rgba(255, 42, 42, 0.35), inset 0 0 25px rgba(255, 0, 0, 0.15) !important;
    }
    
    .container::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255, 46, 136, 0.06) 0%, rgba(46, 151, 255, 0.04) 35%, transparent 70%);
      pointer-events: none;
    }

    .bg-icon {
      position: absolute;
      fill: none;
      stroke-width: 1.8;
      pointer-events: none;
      opacity: 0.18;
      transition: all 0.3s ease;
    }
    .bg-cocktail { top: 22px; right: 28px; width: 70px; height: 70px; stroke: var(--neon-pink); filter: drop-shadow(0 0 10px var(--neon-pink)); transform: rotate(12deg); }
    .bg-beer { bottom: 25px; right: 40px; width: 62px; height: 62px; stroke: var(--neon-yellow); filter: drop-shadow(0 0 10px var(--neon-yellow)); transform: rotate(-8deg); }
    .bg-sparkle1 { top: 28%; left: 45%; width: 28px; height: 28px; stroke: var(--neon-blue); filter: drop-shadow(0 0 8px var(--neon-blue)); }
    .bg-heart { bottom: 20px; left: 28px; width: 55px; height: 55px; stroke: var(--neon-purple); filter: drop-shadow(0 0 10px var(--neon-purple)); }

    .controls {
      flex: 1.1;
      min-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      position: relative;
      z-index: 1;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 34px;
      height: 34px;
      stroke: var(--neon-pink);
      filter: drop-shadow(0 0 8px var(--neon-pink));
      transition: stroke 0.3s ease;
    }

    body.anxiety-mode .title-icon, .fake-anxiety .title-icon {
      stroke: var(--neon-red) !important;
      filter: drop-shadow(0 0 8px var(--neon-red)) !important;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      color: var(--neon-pink);
      text-shadow: 0 0 8px var(--neon-pink), 0 0 18px var(--neon-pink);
      letter-spacing: 1px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    body.anxiety-mode h2, .fake-anxiety h2 {
      color: var(--neon-red) !important;
      text-shadow: 0 0 8px var(--neon-red), 0 0 18px var(--neon-red) !important;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.4);
      margin-top: 2px;
      transition: color 0.3s ease;
    }

    body.anxiety-mode .subtitle, .fake-anxiety .subtitle {
      color: #ff9999 !important;
    }

    .stage-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(46, 151, 255, 0.15);
      border: 1px solid var(--neon-blue);
      color: var(--neon-blue);
      text-shadow: 0 0 6px var(--neon-blue);
      width: fit-content;
      margin-top: 2px;
      transition: all 0.3s ease;
    }

    .stage-badge.comparing {
      background: rgba(0, 245, 212, 0.15);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      text-shadow: 0 0 6px var(--neon-cyan);
    }

    .stage-badge.finalized {
      background: rgba(57, 255, 20, 0.15);
      border-color: var(--neon-green);
      color: var(--neon-green);
      text-shadow: 0 0 6px var(--neon-green);
    }

    body.anxiety-mode .stage-badge, .fake-anxiety .stage-badge {
      background: rgba(255, 42, 42, 0.2) !important;
      border-color: var(--neon-red) !important;
      color: var(--neon-red) !important;
      text-shadow: 0 0 8px var(--neon-red) !important;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    body.anxiety-mode .stat-row, .fake-anxiety .stat-row {
      border-color: rgba(255, 50, 50, 0.2) !important;
      background: rgba(255, 0, 0, 0.03) !important;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .stat-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-icon {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      fill: none;
      filter: drop-shadow(0 0 5px currentColor);
    }

    .stat-val-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 8, 14, 0.85);
      padding: 2px 10px;
      border-radius: 8px;
      border: 1px solid rgba(46, 151, 255, 0.35);
    }

    .stat-val {
      color: var(--neon-blue);
      font-weight: 700;
      font-size: 16px;
      text-shadow: 0 0 6px var(--neon-blue);
      font-family: 'Courier New', Courier, monospace;
    }

    body.anxiety-mode .stat-val, .fake-anxiety .stat-val {
      color: #ff7777 !important;
      text-shadow: 0 0 6px #ff4444 !important;
    }

    .prev-val-tag {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    
    input[type="range"]::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, var(--neon-blue) 0%, var(--neon-purple) 100%);
      height: 8px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(46, 151, 255, 0.4);
    }

    body.anxiety-mode input[type="range"]::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #551111 0%, #aa2222 100%);
      box-shadow: 0 0 10px rgba(255, 42, 42, 0.2);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid var(--neon-blue);
      cursor: pointer;
      margin-top: -7px;
      box-shadow: 0 0 8px #ffffff, 0 0 18px var(--neon-blue);
      transition: box-shadow 0.15s ease-in-out;
    }

    body.anxiety-mode input[type="range"]::-webkit-slider-thumb {
      border-color: var(--neon-red);
      background: #ffaaaa;
      box-shadow: 0 0 8px #ffffff, 0 0 18px var(--neon-red);
    }

    .points-box {
      margin-top: 2px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.28), inset 0 0 10px rgba(57, 255, 20, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--neon-green);
      text-shadow: 0 0 6px var(--neon-green), 0 0 12px var(--neon-green);
      font-family: 'Courier New', Courier, monospace;
      transition: all 0.3s ease;
    }

    body.anxiety-mode .points-box, .fake-anxiety .points-box {
      border-color: var(--neon-red) !important;
      color: var(--neon-red) !important;
      text-shadow: 0 0 6px var(--neon-red) !important;
      box-shadow: 0 0 18px rgba(255, 42, 42, 0.4) !important;
    }

    .points-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .points-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .lock-prev-btn {
      grid-column: span 2;
      background: rgba(0, 245, 212, 0.12);
      border: 1.5px solid var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.25);
      text-shadow: 0 0 6px var(--neon-cyan);
      font-size: 14px;
    }
    .lock-prev-btn:hover {
      background: rgba(0, 245, 212, 0.25);
      box-shadow: 0 0 22px rgba(0, 245, 212, 0.6);
      transform: translateY(-1px);
    }

    .confirm-btn {
      background: rgba(57, 255, 20, 0.1);
      border: 1.5px solid var(--neon-green);
      color: var(--neon-green);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
      text-shadow: 0 0 6px var(--neon-green);
    }
    .confirm-btn:not(:disabled):hover {
      background: rgba(57, 255, 20, 0.25);
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.5);
      transform: translateY(-1px);
    }
    .confirm-btn:disabled, .clear-all-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #475569;
      color: #64748b;
      box-shadow: none;
      text-shadow: none;
    }

    .clear-all-btn {
      background: rgba(148, 163, 184, 0.1);
      border: 1.5px solid #94a3b8;
      color: #e2e8f0;
      box-shadow: 0 0 10px rgba(148, 163, 184, 0.2);
    }
    .clear-all-btn:not(:disabled):hover {
      background: rgba(148, 163, 184, 0.25);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .floating-anxiety-btn {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 100;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      background: rgba(20, 10, 15, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--neon-red);
      color: var(--neon-red);
      box-shadow: 0 0 20px rgba(255, 42, 42, 0.35), 0 8px 20px rgba(0,0,0,0.6);
      text-shadow: 0 0 8px var(--neon-red);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .floating-anxiety-btn.revealed {
      display: flex;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .floating-anxiety-btn:hover {
      transform: translateY(-3px) scale(1.04);
      background: rgba(255, 42, 42, 0.25);
      box-shadow: 0 0 30px rgba(255, 42, 42, 0.7), 0 12px 25px rgba(0,0,0,0.8);
    }

    body.anxiety-mode .floating-anxiety-btn {
      border-color: var(--neon-green);
      color: var(--neon-green);
      text-shadow: 0 0 8px var(--neon-green);
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
    }
    body.anxiety-mode .floating-anxiety-btn:hover {
      background: rgba(57, 255, 20, 0.25);
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.8);
    }

    .btn-icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .chart-container {
      flex: 1.3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      position: relative;
    }

    .chart-legend {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      font-weight: 600;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-line-current {
      width: 24px;
      height: 3.5px;
      background: var(--neon-blue);
      box-shadow: 0 0 8px var(--neon-blue);
      border-radius: 2px;
    }

    .legend-line-prev {
      width: 24px;
      height: 2.5px;
      border-top: 2.5px dashed #94a3b8;
      box-shadow: 0 0 6px #cbd5e1;
    }

    svg.radar-svg-el {
      width: 100%;
      max-width: 600px;
      height: 600px;
      overflow: visible;
      filter: drop-shadow(0 0 14px rgba(188, 46, 255, 0.4));
      transition: filter 0.5s ease;
    }

    body.anxiety-mode svg.radar-svg-el, .fake-anxiety svg.radar-svg-el {
      filter: drop-shadow(0 0 18px rgba(255, 42, 42, 0.6)) !important;
    }

    /* 正常網格線條 */
    .grid-line {
      fill: none;
      stroke: var(--neon-purple);
      stroke-width: 1.6;
      stroke-opacity: 0.7;
      transition: stroke 0.5s ease, stroke-opacity 0.5s ease;
    }

    /* 焦慮模式網格警示律動動畫 */
    body.anxiety-mode .grid-line, .fake-anxiety .grid-line {
      stroke: #ff2a2a !important;
      stroke-opacity: 0.85 !important;
      animation: gridPulse 2.5s infinite alternate ease-in-out;
    }

    @keyframes gridPulse {
      0% {
        stroke-opacity: 0.4;
        stroke: #990022;
      }
      100% {
        stroke-opacity: 0.95;
        stroke: #ff3355;
      }
    }

    .axis-line {
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 1.4;
      stroke-dasharray: 4 4;
      transition: stroke 0.5s ease;
    }

    body.anxiety-mode .axis-line, .fake-anxiety .axis-line {
      stroke: rgba(255, 68, 68, 0.4) !important;
    }

    .inward-vortex-layer {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      mix-blend-mode: screen;
    }

    body.anxiety-mode .inward-vortex-layer, .fake-anxiety .inward-vortex-layer {
      opacity: 1 !important;
    }

    .vortex-inflow-ring {
      fill: none;
      stroke: #ff2a2a;
      stroke-dasharray: 6 6 12 6;
      transform-origin: 300px 300px;
    }

    .vortex-inflow-1 { stroke-width: 1.6; animation: inwardSuck 3.2s infinite linear; opacity: 0.65; }
    .vortex-inflow-2 { stroke-width: 1.3; stroke: #ff0055; stroke-dasharray: 4 6 8 4; animation: inwardSuck 4.2s infinite linear reverse; animation-delay: -1.2s; opacity: 0.55; }
    .vortex-inflow-3 { stroke-width: 1.8; stroke: #bc2eff; animation: inwardSuck 5.5s infinite linear; animation-delay: -2.4s; opacity: 0.45; }

    @keyframes inwardSuck {
      0% { transform: scale(1.2) rotate(0deg); opacity: 0.75; stroke-width: 2px; }
      50% { opacity: 0.45; }
      100% { transform: scale(0.1) rotate(360deg); opacity: 0; stroke-width: 0.6px; }
    }

    .radar-area-prev {
      fill: rgba(148, 163, 184, 0.12);
      stroke: #cbd5e1;
      stroke-width: 2.5;
      stroke-dasharray: 6 4;
      filter: drop-shadow(0 0 6px rgba(203, 213, 225, 0.6));
      transition: points 0.8s cubic-bezier(0.55, 0, 0.1, 1), stroke 0.4s ease, fill 0.4s ease;
    }

    body.anxiety-mode .radar-area-prev, .fake-anxiety .radar-area-prev {
      fill: rgba(148, 163, 184, 0.08) !important;
      stroke: #8899aa !important;
      stroke-dasharray: 4 3 !important;
      filter: drop-shadow(0 0 4px rgba(136, 153, 170, 0.5)) !important;
    }

    .radar-point-prev {
      fill: #ffffff;
      stroke: #94a3b8;
      stroke-width: 2;
      transition: all 0.8s cubic-bezier(0.55, 0, 0.1, 1);
    }

    body.anxiety-mode .radar-point-prev, .fake-anxiety .radar-point-prev {
      stroke: #8899aa !important;
      r: 3.8;
    }

    .radar-area {
      fill: rgba(46, 151, 255, 0.24);
      stroke: var(--neon-blue);
      stroke-width: 3.8;
      filter: drop-shadow(0 0 12px var(--neon-blue));
      transition: points 0.8s cubic-bezier(0.55, 0, 0.1, 1), stroke 0.4s ease, fill 0.4s ease;
    }

    body.anxiety-mode .radar-area, .fake-anxiety .radar-area {
      fill: rgba(46, 151, 255, 0.16) !important;
      stroke: #4488cc !important;
      stroke-dasharray: 5 3 !important;
      filter: drop-shadow(0 0 6px rgba(68, 136, 204, 0.6)) !important;
    }

    .radar-point {
      fill: #ffffff;
      stroke: var(--neon-blue);
      stroke-width: 2.8;
      filter: drop-shadow(0 0 8px #ffffff);
      transition: all 0.8s cubic-bezier(0.55, 0, 0.1, 1);
    }

    body.anxiety-mode .radar-point, .fake-anxiety .radar-point {
      stroke: #4488cc !important;
      r: 4.2;
    }

    .stat-label {
      font-size: 14px;
      font-weight: 700;
      fill: var(--text-color);
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
      transition: fill 0.3s ease;
    }

    body.anxiety-mode .stat-label, .fake-anxiety .stat-label {
      fill: #ffb4b4 !important;
      text-shadow: 0 0 6px #ff2a2a !important;
    }

    .svg-node-icon {
      stroke-width: 2;
      fill: none;
    }

    @media (max-width: 960px) {
      .ambient-icon { display: none; }
      .bar-sign { font-size: 18px; padding: 8px 20px; }
      .container {
        flex-direction: column-reverse;
        padding: 28px 20px;
        gap: 30px;
      }
      .controls { width: 100%; min-width: 100%; }
      svg.radar-svg-el { max-width: 440px; height: 440px; }
      .floating-anxiety-btn {
        right: 16px;
        bottom: 16px;
        padding: 10px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card">
      <div style="display:flex; justify-content:center;">
        <svg viewBox="0 0 24 24" width="36" height="36" stroke="var(--neon-pink)" fill="none" stroke-width="2"><path d="M8 22h8M12 15v7M3 4l9 11 9-11H3zM5.5 7h13"/></svg>
      </div>
      <h1>歡迎來到精神調配所</h1>
      <p>在開始前，請留下你的名字或專屬調配代號：</p>
      <input type="text" id="welcomeNameInput" class="welcome-input" placeholder="輸入你的名字..." autofocus />
      <button class="start-btn" id="startPlanningBtn">🍸 進入調配吧檯</button>
    </div>
  </div>

  <svg class="ambient-icon amb-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 0-4 1"/><path d="M12 22a10 10 0 0 0 4-1"/></svg>
  <svg class="ambient-icon amb-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  <svg class="ambient-icon amb-candle" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 8h10v9H7zM12 3a2 2 0 0 1 2 2c0 1.5-2 3-2 3s-2-1.5-2-3a2 2 0 0 1 2-2z"/></svg>
  <svg class="ambient-icon amb-stars" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>

  <div class="bar-sign" id="barSign">
    <svg class="sign-mini-icon" viewBox="0 0 24 24"><path d="M8 22h8M12 15v7M3 4l9 11 9-11H3z"/></svg>
    <span id="signText">🍸 地下解憂Bar 之精神調配</span>
    <svg class="sign-mini-icon" viewBox="0 0 24 24"><path d="m12 3 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>
  </div>

  <div class="container" id="captureContainer">
    <svg class="bg-icon bg-cocktail" viewBox="0 0 24 24"><path d="M8 22h8M12 15v7M3 4l9 11 9-11H3zM5.5 7h13"/></svg>
    <svg class="bg-icon bg-beer" viewBox="0 0 24 24"><path d="M17 11h1a3 3 0 0 1 0 6h-1M5 8h12v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8zM5 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2M8 12v5M12 12v5"/></svg>
    <svg class="bg-icon bg-sparkle1" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
    <svg class="bg-icon bg-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>

    <div class="controls">
      <div>
        <div class="title-box">
          <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M8 22h8M12 15v7M3 4l9 11 9-11H3zM5.5 7h13"/></svg>
          <h2 id="mainTitle">精神力調配</h2>
        </div>
        <div class="stage-badge" id="stageBadge">
          <span>階段 1：喚起【上學期】實際調配</span>
        </div>
        <p class="subtitle" id="mainSubtitle">拖曳滑桿調配精神力（每項上限 50，總上限 100）</p>
      </div>

      <div id="sliders" style="display: flex; flex-direction: column; gap: 10px;"></div>

      <div class="points-box">
        <div class="points-label">
          <svg class="points-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="pointsLabel">剩餘精神力</span>
        </div>
        <span id="points-display">100 / 100</span>
      </div>

      <div class="btn-grid">
        <!-- 採用純向量 SVG 繪製的霓虹圖釘（永不出現字碼錯誤） -->
        <button class="action-btn lock-prev-btn" id="lockPrevBtn">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6a3 3 0 0 0-6 0v4.76z"/></svg>
          <span id="lockPrevBtnText">鎖定上學期（開始調配下學期）</span>
        </button>

        <button class="action-btn confirm-btn" id="confirmBtn" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="confirmBtnText">確認精神調配</span>
        </button>

        <button class="action-btn clear-all-btn" id="clearAllBtn" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          <span>換下位調配師</span>
        </button>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-legend" id="chartLegend" style="display: none;">
        <div class="legend-item" id="legendPrev">
          <span class="legend-line-prev"></span>
          <span id="legendPrevText" style="color: #cbd5e1;">上學期基準</span>
        </div>
        <div class="legend-item" id="legendCurrent">
          <span class="legend-line-current"></span>
          <span id="legendCurrentText" style="color: var(--neon-blue);">下學期調配</span>
        </div>
      </div>

      <svg id="radarSvg" class="radar-svg-el" viewBox="0 0 600 600" width="600" height="600"></svg>
    </div>
  </div>

  <button class="floating-anxiety-btn" id="anxietyBtn">
    
    <span id="anxietyBtnText">⚠️ 注入無意義焦慮</span>
  </button>

  <script>
    let currentUserName = '';
    let isAnxietyMode = false;
    let isFinalized = false;
    let TOTAL_POINTS = 100;
    const SLIDER_MAX = 50;
    const FIXED_SCALE_MAX = 30;
    const SHRINK_RATIO = 0.70;

    let previousStats = null;

    const stats = [
      { name: '課業', value: 0, color: '#38bdf8', iconPath: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>' },
      { name: '興趣/活動', value: 0, color: '#facc15', iconPath: '<path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>' },
      { name: '家庭', value: 0, color: '#ff2e88', iconPath: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>' },
      { name: '職涯打工', value: 0, color: '#bc2eff', iconPath: '<rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>' },
      { name: '同儕/戀愛', value: 0, color: '#39ff14', iconPath: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>' }
    ];

    const cx = 300, cy = 300, radius = 190;
    const svg = document.getElementById('radarSvg');
    const slidersContainer = document.getElementById('sliders');
    const lockPrevBtn = document.getElementById('lockPrevBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const anxietyBtn = document.getElementById('anxietyBtn');
    const captureContainer = document.getElementById('captureContainer');
    const welcomeOverlay = document.getElementById('welcomeOverlay');
    const welcomeNameInput = document.getElementById('welcomeNameInput');
    const startPlanningBtn = document.getElementById('startPlanningBtn');

    function isNightTime() {
      const currentHour = new Date().getHours();
      return currentHour >= 12 || currentHour < 6;
    }

    startPlanningBtn.addEventListener('click', () => {
      const name = welcomeNameInput.value.trim();
      currentUserName = name || '解憂訪客';
      document.getElementById('mainTitle').textContent = `${currentUserName} - 精神力調配`;
      welcomeOverlay.classList.add('hidden');
    });

    welcomeNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startPlanningBtn.click();
    });

    function drawBackground(targetSvg = svg) {
      targetSvg.innerHTML = '';

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = `
        <filter id="neonGlow">
          <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      `;
      targetSvg.appendChild(defs);

      const vortexGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      vortexGroup.setAttribute('class', 'inward-vortex-layer');
      vortexGroup.innerHTML = `
        <circle cx="${cx}" cy="${cy}" r="110" class="vortex-inflow-ring vortex-inflow-1" />
        <circle cx="${cx}" cy="${cy}" r="75"  class="vortex-inflow-ring vortex-inflow-2" />
        <circle cx="${cx}" cy="${cy}" r="40"  class="vortex-inflow-ring vortex-inflow-3" />
        <circle cx="${cx}" cy="${cy}" r="6"   fill="rgba(255, 42, 42, 0.7)" filter="url(#neonGlow)" />
      `;
      targetSvg.appendChild(vortexGroup);

      for (let level = 1; level <= 5; level++) {
        const r = (radius / 5) * level;
        const pts = stats.map((_, i) => {
          const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
          return `${(cx + r * Math.cos(angle)).toFixed(1)},${(cy + r * Math.sin(angle)).toFixed(1)}`;
        }).join(' ');
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', pts);
        poly.setAttribute('class', 'grid-line');
        poly.setAttribute('filter', 'url(#neonGlow)');
        targetSvg.appendChild(poly);
      }

      stats.forEach((stat, i) => {
        const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', cx);
        line.setAttribute('y1', cy);
        line.setAttribute('x2', x);
        line.setAttribute('y2', y);
        line.setAttribute('class', 'axis-line');
        targetSvg.appendChild(line);

        const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const offsetDist = 28;
        const anchorX = cx + (radius + offsetDist) * Math.cos(angle);
        const anchorY = cy + (radius + offsetDist) * Math.sin(angle);

        let iconOffsetX = 0, iconOffsetY = 0;
        let textOffsetX = 0, textOffsetY = 0;
        let textAnchor = 'middle';

        if (i === 0) { iconOffsetX = -10; iconOffsetY = -8; textOffsetY = -24; }
        else if (i === 1) { iconOffsetX = 2; iconOffsetY = -24; textOffsetX = 2; textOffsetY = 4; textAnchor = 'start'; }
        else if (i === 2) { iconOffsetX = -10; iconOffsetY = 4; textOffsetY = 30; }
        else if (i === 3) { iconOffsetX = -10; iconOffsetY = 4; textOffsetY = 30; }
        else if (i === 4) { iconOffsetX = -20; iconOffsetY = -24; textOffsetX = -2; textOffsetY = 4; textAnchor = 'end'; }

        const iconG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        iconG.setAttribute('transform', `translate(${anchorX + iconOffsetX}, ${anchorY + iconOffsetY}) scale(0.8)`);
        iconG.setAttribute('class', 'svg-node-icon');
        iconG.setAttribute('stroke', stat.color);
        iconG.setAttribute('style', `filter: drop-shadow(0 0 4px ${stat.color});`);
        iconG.innerHTML = stat.iconPath;
        labelGroup.appendChild(iconG);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', anchorX + textOffsetX);
        text.setAttribute('y', anchorY + textOffsetY);
        text.setAttribute('text-anchor', textAnchor);
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('class', 'stat-label');
        text.textContent = stat.name;
        labelGroup.appendChild(text);

        targetSvg.appendChild(labelGroup);
      });

      const radarPrevPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      radarPrevPoly.setAttribute('class', 'radar-area-prev');
      radarPrevPoly.style.display = 'none';
      targetSvg.appendChild(radarPrevPoly);

      const pointsPrevGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      targetSvg.appendChild(pointsPrevGroup);

      const radarPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      radarPoly.setAttribute('class', 'radar-area');
      targetSvg.appendChild(radarPoly);

      const pointsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      targetSvg.appendChild(pointsGroup);
    }

    function updateChart(targetContainer = document, forceAnxiety = null) {
      const isAnx = (forceAnxiety !== null) ? forceAnxiety : isAnxietyMode;
      const poly = targetContainer.querySelector('.radar-area');
      const prevPoly = targetContainer.querySelector('.radar-area-prev');
      const allGroups = targetContainer.querySelectorAll('.chart-container svg g');
      
      const pointsPrevGroup = allGroups[allGroups.length - 2];
      const pointsGroup = allGroups[allGroups.length - 1];
      
      if (pointsGroup) pointsGroup.innerHTML = '';
      if (pointsPrevGroup) pointsPrevGroup.innerHTML = '';

      const currentTotal = stats.reduce((sum, s) => sum + s.value, 0);

      if (previousStats && prevPoly) {
        prevPoly.style.display = 'block';
        const prevCoords = previousStats.map((stat, i) => {
          const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
          let effectivePrevVal = stat.value;
          if (isAnx && effectivePrevVal > 0) {
            effectivePrevVal = Math.round(effectivePrevVal * SHRINK_RATIO);
          }
          const r = (effectivePrevVal > 0) ? Math.min(radius, (effectivePrevVal / FIXED_SCALE_MAX) * radius) : 0;
          const x = cx + r * Math.cos(angle);
          const y = cy + r * Math.sin(angle);

          if (effectivePrevVal > 0 && pointsPrevGroup) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', x);
            circle.setAttribute('cy', y);
            circle.setAttribute('r', isAnx ? 3.8 : 4.5);
            circle.setAttribute('class', 'radar-point-prev');
            pointsPrevGroup.appendChild(circle);
          }
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        prevPoly.setAttribute('points', prevCoords.join(' '));
      } else if (prevPoly) {
        prevPoly.style.display = 'none';
      }

      if (poly) {
        const coords = stats.map((stat, i) => {
          const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
          let effectiveVal = stat.value;
          if (isAnx && effectiveVal > 0) {
            effectiveVal = Math.round(effectiveVal * SHRINK_RATIO);
          }
          const r = (effectiveVal > 0) ? Math.min(radius, (effectiveVal / FIXED_SCALE_MAX) * radius) : 0;
          const x = cx + r * Math.cos(angle);
          const y = cy + r * Math.sin(angle);

          if (effectiveVal > 0 && pointsGroup) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', x);
            circle.setAttribute('cy', y);
            circle.setAttribute('r', isAnx ? 4.2 : 5.5);
            circle.setAttribute('class', 'radar-point');
            pointsGroup.appendChild(circle);
          }
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        poly.setAttribute('points', coords.join(' '));
      }

      const pointsDisplay = targetContainer.querySelector('#points-display') || document.getElementById('points-display');
      if (pointsDisplay) {
        const remaining = TOTAL_POINTS - currentTotal;
        pointsDisplay.textContent = isAnx ? `0 (被內耗吞噬)` : `${remaining} / ${TOTAL_POINTS}`;
      }
    }

    function createSliders() {
      slidersContainer.innerHTML = '';
      stats.forEach((stat, i) => {
        let prevValInfo = '';
        if (previousStats) {
          if (isAnxietyMode && previousStats[i].value > 0) {
            const shrinkPrev = Math.round(previousStats[i].value * SHRINK_RATIO);
            prevValInfo = `<span class="prev-val-tag" style="color:#ff8888;">（上學期萎縮: ${shrinkPrev}）</span>`;
          } else {
            prevValInfo = `<span class="prev-val-tag">（上學期: ${previousStats[i].value}）</span>`;
          }
        }

        let displayVal = stat.value;
        if (isAnxietyMode && stat.value > 0) {
          const shrinkVal = Math.round(stat.value * SHRINK_RATIO);
          displayVal = `${shrinkVal} <span style="font-size:12px;color:#ff6666;">(-${stat.value - shrinkVal})</span>`;
        }

        const isInputDisabled = isAnxietyMode || isFinalized;

        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <div class="stat-header">
            <div class="stat-title">
              <svg class="stat-icon" style="stroke: ${isAnxietyMode ? '#ff4444' : stat.color};" viewBox="0 0 24 24">${stat.iconPath}</svg>
              <span style="${isAnxietyMode ? 'color:#ff9999;' : ''}">${stat.name}</span>
              ${prevValInfo}
            </div>
            <div class="stat-val-box">
              <span class="stat-val" id="val-${i}">${displayVal}</span>
            </div>
          </div>
          <input type="range" min="0" max="${SLIDER_MAX}" value="${stat.value}" data-index="${i}" ${isInputDisabled ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>
        `;
        slidersContainer.appendChild(row);
      });

      slidersContainer.addEventListener('input', (e) => {
        if (!e.target.matches('input[type="range"]') || isAnxietyMode || isFinalized) return;
        const idx = Number(e.target.dataset.index);
        let newVal = Number(e.target.value);
        const otherSum = stats.reduce((sum, s, i) => i === idx ? sum : sum + s.value, 0);
        
        if (newVal + otherSum > TOTAL_POINTS) {
          newVal = TOTAL_POINTS - otherSum;
          e.target.value = newVal;
        }

        stats[idx].value = newVal;
        document.getElementById(`val-${idx}`).textContent = newVal;
        updateChart();
      });
    }

    lockPrevBtn.addEventListener('click', () => {
      if (isAnxietyMode || isFinalized) return;
      const currentSum = stats.reduce((sum, s) => sum + s.value, 0);
      if (currentSum === 0) {
        alert('請先為「上學期」調配精神力後再進行鎖定比對喔！');
        return;
      }

      previousStats = JSON.parse(JSON.stringify(stats));
      stats.forEach(s => s.value = 0);
      confirmBtn.disabled = false;

      const stageBadge = document.getElementById('stageBadge');
      stageBadge.classList.add('comparing');
      stageBadge.innerHTML = '<span>階段 2：調配【下學期】</span>';
      document.getElementById('chartLegend').style.display = 'flex';
      document.getElementById('legendPrev').style.display = 'flex';
      
      // 使用 innerText 設置純文字，圖釘圖示由內嵌向量 SVG 自行維持
      document.getElementById('lockPrevBtnText').innerText = '重新更新上學期基準';

      createSliders();
      updateChart();
    });

    confirmBtn.addEventListener('click', () => {
      if (isFinalized || !previousStats) return;
      const currentSum = stats.reduce((sum, s) => sum + s.value, 0);
      if (currentSum === 0) {
        alert('請先調配「下學期」的精神力後再點擊確認喔！');
        return;
      }

      isFinalized = true;
      lockPrevBtn.disabled = true;
      lockPrevBtn.style.opacity = '0.4';
      lockPrevBtn.style.cursor = 'not-allowed';

      confirmBtn.disabled = true;
      document.getElementById('confirmBtnText').textContent = '🔒 已確認（無法再修改）';

      clearAllBtn.disabled = false;

      const stageBadge = document.getElementById('stageBadge');
      stageBadge.className = 'stage-badge finalized';
      stageBadge.innerHTML = '<span>🎉 調配已確定完成</span>';

      createSliders();

      if (isNightTime()) {
        anxietyBtn.classList.add('revealed');
      }
    });

    async function captureElement(element) {
      return await html2canvas(element, {
        backgroundColor: '#090a10',
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false
      });
    }

    function combineCanvases(c1, c2) {
      const merged = document.createElement('canvas');
      merged.width = Math.max(c1.width, c2.width);
      merged.height = c1.height + c2.height + 40;
      const ctx = merged.getContext('2d');

      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, merged.width, merged.height);

      ctx.drawImage(c1, 0, 0);
      
      ctx.strokeStyle = '#bc2eff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(40, c1.height + 20);
      ctx.lineTo(merged.width - 40, c1.height + 20);
      ctx.stroke();

      ctx.drawImage(c2, 0, c1.height + 40);
      return merged;
    }

    async function captureAnxietyOffscreen() {
      const clone = captureContainer.cloneNode(true);
      clone.classList.add('fake-anxiety');
      clone.style.position = 'fixed';
      clone.style.top = '-9999px';
      clone.style.left = '-9999px';
      clone.style.width = `${captureContainer.offsetWidth}px`;
      clone.style.zIndex = '-1';
      document.body.appendChild(clone);

      const cloneTitle = clone.querySelector('#mainTitle');
      if (cloneTitle) cloneTitle.textContent = `${currentUserName} - 無意義焦慮侵蝕`;
      const cloneSubtitle = clone.querySelector('#mainSubtitle');
      if (cloneSubtitle) cloneSubtitle.textContent = '上學期的記憶與下學期的調配，雙雙被無意義的內耗蠶食萎縮 30%...';
      const cloneBadge = clone.querySelector('#stageBadge');
      if (cloneBadge) cloneBadge.innerHTML = '<span>⚠️ 警報：雙學期產出同步微幅塌陷</span>';
      
      const cloneLegendCurrent = clone.querySelector('#legendCurrentText');
      if (cloneLegendCurrent) cloneLegendCurrent.textContent = '下學期 (萎縮)';
      const cloneLegendPrev = clone.querySelector('#legendPrevText');
      if (cloneLegendPrev) cloneLegendPrev.textContent = '上學期 (萎縮)';

      const statRows = clone.querySelectorAll('.stat-row');
      stats.forEach((stat, i) => {
        if (statRows[i]) {
          const valEl = statRows[i].querySelector('.stat-val');
          const shrinkVal = Math.round(stat.value * SHRINK_RATIO);
          if (valEl) valEl.innerHTML = `${shrinkVal} <span style="font-size:12px;color:#ff6666;">(-${stat.value - shrinkVal})</span>`;
          
          const prevTag = statRows[i].querySelector('.prev-val-tag');
          if (prevTag && previousStats && previousStats[i].value > 0) {
            const shrinkPrev = Math.round(previousStats[i].value * SHRINK_RATIO);
            prevTag.innerHTML = `（上學期萎縮: ${shrinkPrev}）`;
            prevTag.style.color = '#ff8888';
          }
        }
      });

      const cloneSvg = clone.querySelector('svg.radar-svg-el');
      drawBackground(cloneSvg);
      updateChart(clone, true);

      await new Promise(r => setTimeout(r, 150));
      const canvas = await captureElement(clone);
      document.body.removeChild(clone);
      return canvas;
    }

    clearAllBtn.addEventListener('click', async () => {
      if (!isFinalized || !previousStats) {
        alert('請先完成雙學期調配並按下確認後才能存檔喔！');
        return;
      }

      const confirmSave = confirm('是否存檔並換下一位？');
      if (!confirmSave) return;

      const userName = currentUserName || '未命名調配師';
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}`;

      const canvasNormal = await captureElement(captureContainer);
      const canvasAnxiety = await captureAnxietyOffscreen();

      const combined = combineCanvases(canvasNormal, canvasAnxiety);
      const link = document.createElement('a');
      link.download = `解憂Bar_${userName}_精神調配.png`;
      link.href = combined.toDataURL('image/png');
      link.click();

      isAnxietyMode = false;
      document.body.classList.remove('anxiety-mode');
      previousStats = null;
      isFinalized = false;
      stats.forEach(s => s.value = 0);
      currentUserName = '';

      lockPrevBtn.disabled = false;
      lockPrevBtn.style.opacity = '1';
      lockPrevBtn.style.cursor = 'pointer';

      confirmBtn.disabled = true;
      document.getElementById('confirmBtnText').textContent = '確認精神調配';
      clearAllBtn.disabled = true;

      anxietyBtn.classList.remove('revealed');

      const stageBadge = document.getElementById('stageBadge');
      stageBadge.className = 'stage-badge';
      stageBadge.innerHTML = '<span>階段 1：喚起【上學期】實際調配</span>';
      document.getElementById('chartLegend').style.display = 'none';
      document.getElementById('lockPrevBtnText').innerText = '鎖定上學期（開始調配下學期）';
      document.getElementById('mainTitle').textContent = '精神力調配';
      document.getElementById('mainSubtitle').textContent = '拖曳滑桿調配精神力（每項上限 50，總上限 100）';
      document.getElementById('pointsLabel').textContent = '剩餘精神力';

      createSliders();
      updateChart();

      welcomeNameInput.value = '';
      welcomeOverlay.classList.remove('hidden');
    });

    anxietyBtn.addEventListener('click', () => {
      isAnxietyMode = !isAnxietyMode;

      if (isAnxietyMode) {
        document.body.classList.add('anxiety-mode');
        document.getElementById('signText').textContent = '⚠️ 現實焦慮Bar · 內耗侵蝕中';
        document.getElementById('mainTitle').textContent = `${currentUserName} - 無意義焦慮侵蝕`;
        document.getElementById('mainSubtitle').textContent = '上學期的記憶與下學期的調配，被無意義的內耗蠶食萎縮 30%...';
        document.getElementById('stageBadge').innerHTML = '<span>⚠️ 警報：正在被焦慮侵蝕...</span>';
        document.getElementById('pointsLabel').textContent = '自由支配精神力';
        document.getElementById('anxietyBtnText').textContent = '✨ 喚回理智與掌控感';
        document.getElementById('chartLegend').style.display = 'flex';
        document.getElementById('legendCurrentText').textContent = '下學期 (侵蝕)';
        document.getElementById('legendPrevText').textContent = '上學期 (侵蝕)';
      } else {
        document.body.classList.remove('anxiety-mode');
        document.getElementById('signText').textContent = '🍸 地下解憂Bar 之精神調配';
        document.getElementById('mainTitle').textContent = `${currentUserName} - 精神力調配`;
        document.getElementById('mainSubtitle').textContent = '拖曳滑桿調配精神力（每項上限 50，總上限 100）';
        const stageBadge = document.getElementById('stageBadge');
        stageBadge.className = 'stage-badge finalized';
        stageBadge.innerHTML = '<span>🎉 調配已確定完成</span>';
        document.getElementById('pointsLabel').textContent = '剩餘精神力';
        document.getElementById('legendPrevText').textContent = '上學期基準';
        document.getElementById('anxietyBtnText').textContent = '⚠️ 注入無意義焦慮';
        document.getElementById('legendCurrentText').textContent = '下學期調配';
      }

      createSliders();
      updateChart();
    });

    drawBackground();
    createSliders();
    updateChart();
  </script>
</body>
</html>
